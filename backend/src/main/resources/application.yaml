spring:
  application:
    name: groupware

  datasource:
    url: jdbc:mysql://localhost:3306/groupware?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always             # 앱 시작 시 schema.sql 자동 실행
      continue-on-error: true  # 인덱스 중복 에러 등 무시

  servlet:
    session:
      timeout: 120m

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.durian.groupware
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 200
    default-statement-timeout: 60

logging:
  level:
    com.durian.groupware: DEBUG

app:
  seed:
    enabled: true
    csv-path: ../employees.csv   # 프로젝트 루트 기준 경로